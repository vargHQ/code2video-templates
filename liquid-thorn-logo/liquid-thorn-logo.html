<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Thorn Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Grenze+Gotisch:wght@100..900&family=IBM+Plex+Mono:wght@500;600&family=Metal+Mania&family=Pirata+One&family=Ruslan+Display&family=UnifrakturCook:wght@700&display=swap">
<style>
/* Layout: one centred column on white paper. The chrome mark sits on top, two "aka" captions and one link sit under it. */
:root {
  --paper: #ffffff;
  --ink: #101014;
  --muted: #5d5a72;
  --violet: #2a14e0;
  --panel: #f5f4fc;
  --rule: #dcd9f0;
  --on-violet: #ffffff;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gothic: "Grenze Gotisch", "Ruslan Display", Georgia, serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  background: var(--paper);
  color: var(--ink);
  font: 500 15px/1.5 var(--mono);
  overflow-x: hidden;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; }
main {
  position: relative; z-index: 1;
  box-sizing: border-box; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  padding-block: max(8px, 1.5vh) 40px;
}
#slot {
  width: min(100%, 1280px, calc((100vh - 250px) * 1.7778));
  min-width: min(100%, 300px);
  max-width: 100%;
  aspect-ratio: 16 / 9;
  display: grid; place-items: center;
  touch-action: none;
}
#fallback { margin: 0; font: 900 clamp(48px, 14vw, 160px)/1 var(--gothic); color: var(--ink); text-align: center; }
.lines { display: grid; gap: 1.5em; text-align: center; }
.lines p { margin: 0; overflow-wrap: anywhere; }
#edit {
  margin-top: 1.2em; padding: 2px 0;
  border: 0; background: none; color: var(--violet);
  font: inherit; font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px;
  cursor: pointer;
}
#edit:focus-visible, .panel :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
.panel {
  box-sizing: border-box; width: min(100%, 470px);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: center;
  padding: 16px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  font-size: 13px; color: var(--ink);
}
.panel label { color: var(--muted); }
.panel input[type="text"], .panel select {
  min-width: 0; padding: 7px 9px;
  font: inherit; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
}
.panel input[type="color"] { width: 52px; height: 32px; padding: 2px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; }
.panel .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.panel .row label { color: var(--ink); display: flex; gap: 8px; align-items: center; }
.panel button {
  padding: 7px 14px; font: inherit; font-weight: 600;
  color: var(--on-violet); background: var(--violet);
  border: 1px solid var(--violet); border-radius: 4px; cursor: pointer;
}
@media (max-width: 480px) { .panel { grid-template-columns: minmax(0, 1fr); } }
/* Render mode (?render, used by render.ts): frame-stepped by the recorder, content centred, a drawn cursor. */
html.render main { justify-content: center; padding-block: 24px; }
/* the logo box has ~10% empty margin on each side, so it may spill past the frame on tall formats */
html.render #slot { width: min(118vw, calc((100vh - 250px) * 1.7778)); max-width: none; min-width: 0; flex: none; }
html.render.logo-only #slot { width: min(118vw, calc((100vh - 48px) * 1.7778)); }
#cursor { position: fixed; left: 0; top: 0; z-index: 3; height: max(18px, 2.1vh); pointer-events: none; transform: translate(-200px, -200px); }
#cursor svg { display: block; height: 100%; width: auto; }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<main>
  <div id="slot" role="img" aria-label="Chrome logo with liquid hover effect"><h1 id="fallback" hidden></h1></div>
  <section class="lines">
    <p>aka<br><span id="cap1out">any text you want</span></p>
    <p>aka<br><span id="cap2out">drag your cursor through it</span></p>
  </section>
  <button id="edit" type="button" aria-expanded="false" aria-controls="panel">edit the text</button>
  <div id="cursor" hidden><svg viewBox="0 0 13 20" aria-hidden="true"><path d="M1.2 1.2v15.6l3.9-3.6 2.6 6 2.5-1.1-2.5-5.8h5.2z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <form id="panel" class="panel" hidden>
    <label for="t">Логотип</label>
    <input id="t" type="text" maxlength="24" autocomplete="off" spellcheck="false">
    <label for="c1">Строка 1</label>
    <input id="c1" type="text" maxlength="60" autocomplete="off">
    <label for="c2">Строка 2</label>
    <input id="c2" type="text" maxlength="60" autocomplete="off">
    <label for="f">Шрифт</label>
    <select id="f">
      <option value="grenze">Grenze Gotisch</option>
      <option value="grenzeBold">Grenze Gotisch Black</option>
      <option value="pirata">Pirata One</option>
      <option value="unifraktur">UnifrakturCook</option>
      <option value="metal">Metal Mania</option>
      <option value="amatic">Amatic SC (кириллица)</option>
      <option value="ruslan">Ruslan Display (кириллица)</option>
    </select>
    <label for="col">Цвет жидкости</label>
    <input id="col" type="color">
    <div class="row">
      <label><input id="auto" type="checkbox"> Автодемо, пока курсор стоит</label>
      <button id="reroll" type="button">Другие шипы</button>
    </div>
  </form>
</main>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const canvas = $('gl'), slot = $('slot');

// ---------- state ----------
const FONTS = {
  grenze:     { css: '600 {S}px "Grenze Gotisch", "Ruslan Display", serif', squeeze: 0.8 },
  grenzeBold: { css: '900 {S}px "Grenze Gotisch", "Ruslan Display", serif', squeeze: 0.86 },
  pirata:     { css: '400 {S}px "Pirata One", "Ruslan Display", serif', squeeze: 0.84 },
  unifraktur: { css: '700 {S}px "UnifrakturCook", "Ruslan Display", serif', squeeze: 0.86 },
  metal:      { css: '400 {S}px "Metal Mania", "Ruslan Display", serif', squeeze: 0.8 },
  amatic:     { css: '700 {S}px "Amatic SC", "Ruslan Display", sans-serif', squeeze: 1.0 },
  ruslan:     { css: '400 {S}px "Ruslan Display", serif', squeeze: 0.74 },
};
const state = {
  text: 'VARG', cap1: 'any text you want', cap2: 'drag your cursor through it',
  font: 'grenze', color: '#2a14e0', seed: 7, auto: true,
};
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
if (!RENDER) { try { Object.assign(state, JSON.parse(localStorage.getItem('liquid-thorn-logo') || '{}')); } catch (e) {} }
for (const k of ['text', 'font', 'color', 'cap1', 'cap2']) if (params.get(k) != null) state[k] = params.get(k);
if (params.get('seed')) state.seed = +params.get('seed') || state.seed;
if (RENDER) {
  state.auto = false;
  const root = document.documentElement;
  root.classList.add('render');
  if (params.get('link') != null) { $('edit').textContent = params.get('link'); $('edit').hidden = !params.get('link'); }
  if (params.get('captions') === '0') { root.classList.add('logo-only'); document.querySelector('.lines').hidden = true; $('edit').hidden = true; }
  if (params.get('cursor') !== '0') $('cursor').hidden = false;
}
if (!FONTS[state.font]) state.font = 'grenze';
const save = () => { try { localStorage.setItem('liquid-thorn-logo', JSON.stringify(state)); } catch (e) {} };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- small helpers ----------
const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hashStr = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const hexRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

// ---------- the logo mask (2D canvas) ----------
const LW = 2048, LH = 1152;
const mc = document.createElement('canvas'); mc.width = LW; mc.height = LH;
const m = mc.getContext('2d', { willReadFrequently: true });
const layer = document.createElement('canvas'); layer.width = LW; layer.height = LH;
const lc = layer.getContext('2d');

// A tapered horn: base at (x, y) sunk slightly into the body, pointing along (dx, dy), curling sideways by `bend`.
function thorn(ctx, x, y, dx, dy, len, w, bend) {
  const px = -dy, py = dx;
  const bx = x - dx * w * 0.7, by = y - dy * w * 0.7;
  const tx = x + dx * len + px * bend * len, ty = y + dy * len + py * bend * len;
  const cx = bx + dx * len * 0.62, cy = by + dy * len * 0.62;
  ctx.beginPath();
  ctx.moveTo(bx + px * w / 2, by + py * w / 2);
  ctx.quadraticCurveTo(cx + px * w * 0.3, cy + py * w * 0.3, tx, ty);
  ctx.quadraticCurveTo(cx - px * w * 0.3, cy - py * w * 0.3, bx - px * w / 2, by - py * w / 2);
  ctx.closePath();
  ctx.fill();
}

// A crescent along a quadratic curve, thick in the middle and sharp at both ends. Returns a sampler.
function crescent(ctx, P0, P1, P2, W) {
  const at = (t) => {
    const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    const x = a * P0[0] + b * P1[0] + c * P2[0], y = a * P0[1] + b * P1[1] + c * P2[1];
    const tx = 2 * (1 - t) * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
    const ty = 2 * (1 - t) * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
    const l = Math.hypot(tx, ty) || 1;
    return { x, y, tx: tx / l, ty: ty / l, nx: -ty / l, ny: tx / l, w: W * Math.pow(Math.sin(Math.PI * t), 0.75) / 2 };
  };
  const L = [], R = [];
  for (let i = 0; i <= 72; i++) { const p = at(i / 72); L.push([p.x + p.nx * p.w, p.y + p.ny * p.w]); R.push([p.x - p.nx * p.w, p.y - p.ny * p.w]); }
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (const p of L) ctx.lineTo(p[0], p[1]);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath(); ctx.fill();
  return at;
}

// Twisted barbed wire on an ellipse, only the front (lower) or back (upper) half.
function wire(ctx, E, front, r) {
  ctx.clearRect(0, 0, LW, LH);
  ctx.fillStyle = ctx.strokeStyle = '#fff';
  const N = 1400, pts = [];
  const cs = Math.cos(E.rot), sn = Math.sin(E.rot);
  for (let i = 0; i <= N; i++) {
    const t = (front ? 0 : Math.PI) + Math.PI * i / N;
    const ux = E.rx * Math.cos(t), uy = E.ry * Math.sin(t);
    pts.push([E.x + ux * cs - uy * sn, E.y + ux * sn + uy * cs]);
  }
  ctx.lineWidth = 19; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.stroke();
  // carve diagonal grooves so the cable reads as two twisted strands
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineWidth = 2.6;
  let acc = 0;
  const barbs = [];
  let nextBarb = 40 + r() * 40;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    const l = Math.hypot(dx, dy); acc += l; nextBarb -= l;
    const tx = dx / (l || 1), ty = dy / (l || 1), nx = -ty, ny = tx;
    if (acc >= 34) {
      acc -= 34;
      const [x, y] = pts[i];
      ctx.beginPath();
      ctx.moveTo(x + nx * 12 - tx * 7, y + ny * 12 - ty * 7);
      ctx.lineTo(x - nx * 12 + tx * 7, y - ny * 12 + ty * 7);
      ctx.stroke();
    }
    if (nextBarb <= 0 && i > 20 && i < pts.length - 20) { barbs.push([pts[i][0], pts[i][1], Math.atan2(ty, tx)]); nextBarb = 88 + r() * 30; }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const [x, y, a] of barbs) {
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
    const base = a + Math.PI / 4 + (r() - 0.5) * 0.5;
    for (let k = 0; k < 4; k++) {
      const ang = base + k * Math.PI / 2 + (r() - 0.5) * 0.35;
      thorn(ctx, x, y, Math.cos(ang), Math.sin(ang), 24 + r() * 18, 10, (r() - 0.5) * 0.3);
    }
  }
}

const DIL = [];
for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; DIL.push([Math.cos(a) * 5, Math.sin(a) * 5], [Math.cos(a) * 2.5, Math.sin(a) * 2.5]); }
DIL.push([0, 0]);

async function buildMask() {
  const F = FONTS[state.font];
  const text = (state.text || '').trim() || 'VARG';
  const font = F.css.replace('{S}', '400');
  try { await document.fonts.load(font, text); } catch (e) {}
  const r = rng(state.seed * 9973 ^ hashStr(text));
  const rs = rng(state.seed * 31 + 5);

  m.setTransform(1, 0, 0, 1, 0, 0);
  m.globalCompositeOperation = 'source-over';
  m.clearRect(0, 0, LW, LH);
  m.fillStyle = m.strokeStyle = '#fff';
  m.font = font; m.textAlign = 'left'; m.textBaseline = 'alphabetic';
  const mt = m.measureText(text);
  const w = Math.max(1, mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight);
  const h = Math.max(1, mt.actualBoundingBoxAscent + mt.actualBoundingBoxDescent);
  let sy = (LH * 0.34) / h, sx = sy * F.squeeze;
  const maxW = LW * 0.72;
  if (w * sx > maxW) { sx = maxW / w; sy = Math.min(sy, sx / F.squeeze * 1.9); }
  const cx = LW / 2, cy = LH * 0.5;
  const tw = w * sx, th = h * sy;
  const ty0 = cy - th / 2, ty1 = cy + th / 2;
  m.save(); m.translate(cx, cy); m.scale(sx, sy);
  m.fillText(text, -(mt.actualBoundingBoxRight - mt.actualBoundingBoxLeft) / 2, (mt.actualBoundingBoxAscent - mt.actualBoundingBoxDescent) / 2);
  m.restore();

  // --- thorns grown out of the letter outlines ---
  const A0 = m.getImageData(0, 0, LW, LH).data;
  const al = (x, y) => (x < 0 || y < 0 || x >= LW || y >= LH) ? 0 : A0[((y | 0) * LW + (x | 0)) * 4 + 3];
  const cand = [];
  for (let y = 4; y < LH - 4; y += 2) for (let x = 4; x < LW - 4; x += 2) {
    const i = (y * LW + x) * 4 + 3;
    if (A0[i] > 127 && (A0[i - 8] <= 127 || A0[i + 8] <= 127 || A0[i - LW * 8] <= 127 || A0[i + LW * 8] <= 127)) cand.push(x, y);
  }
  const n = cand.length / 2, order = new Uint32Array(n);
  for (let i = 0; i < n; i++) order[i] = i;
  for (let i = n - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = order[i]; order[i] = order[j]; order[j] = t; }
  const minD = 30 * Math.max(0.7, th / 392), cell = minD, gw = Math.ceil(LW / cell);
  const grid = new Map(), pts = [];
  for (let k = 0; k < n; k++) {
    const x = cand[order[k] * 2], y = cand[order[k] * 2 + 1];
    const gx = (x / cell) | 0, gy = (y / cell) | 0;
    let ok = true;
    for (let oy = -1; oy <= 1 && ok; oy++) for (let ox = -1; ox <= 1 && ok; ox++) {
      const p = grid.get((gy + oy) * gw + gx + ox);
      if (p && (p[0] - x) ** 2 + (p[1] - y) ** 2 < minD * minD) ok = false;
    }
    if (!ok) continue;
    grid.set(gy * gw + gx, [x, y]); pts.push([x, y]);
  }
  const scale = th / 392;
  for (const [x, y] of pts) {
    if (r() < 0.22) continue;
    let gx = 0, gy = 0;
    for (let oy = -8; oy <= 8; oy += 2) for (let ox = -8; ox <= 8; ox += 2) { const a = al(x + ox, y + oy); gx += a * ox; gy += a * oy; }
    const gl0 = Math.hypot(gx, gy); if (gl0 < 1e-3) continue;
    const nx = -gx / gl0, ny = -gy / gl0;
    const vert = Math.abs(ny) > 0.6;
    if (!vert && r() < 0.55) continue;
    let L = (12 + r() * 30) * scale;
    if (vert && r() < 0.42) L = (55 + r() * 130) * scale;
    else if (!vert && r() < 0.12) L = (40 + r() * 40) * scale;
    let dx = nx + (r() - 0.5) * 0.5, dy = ny + (r() - 0.5) * 0.3;
    if (vert) dx += ((x - cx) / (tw / 2)) * 0.35;
    const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
    for (let s = 8; s < L; s += 3) {
      const qx = x + dx * s, qy = y + dy * s;
      if (qx < 4 || qy < 4 || qx > LW - 5 || qy > LH - 5) { L = s - 6; break; }
      if (al(qx, qy) > 127) { L = s * 0.72; break; }
    }
    if (L < 10) continue;
    const bw = Math.min(24, 6 + L * 0.14);
    const bend = (r() - 0.5) * 0.35 + (vert ? Math.sign(x - cx) * Math.sign(-dy || 1) * 0.1 : 0);
    thorn(m, x, y, dx, dy, L, bw, bend);
  }

  // --- symmetric ornaments: centre spikes, big curled horns, side crescents ---
  thorn(m, cx, ty1 - th * 0.12, 0, 1, th * 0.78, 30 * scale, 0);
  thorn(m, cx, ty0 + th * 0.12, 0, -1, th * 0.48, 24 * scale, 0);
  const colInk = (x, fromTop) => {
    for (let o = 0; o <= 48; o += 4) for (const xx of [x + o, x - o]) {
      if (fromTop) { for (let y = 0; y < LH; y += 2) if (al(xx, y) > 127) return [xx, y]; }
      else { for (let y = LH - 1; y >= 0; y -= 2) if (al(xx, y) > 127) return [xx, y]; }
    }
    return null;
  };
  const big = [];
  for (let i = 0; i < 2; i++) big.push({ up: true, fx: 0.22 + i * 0.36 + rs() * 0.12, len: th * (0.38 + rs() * 0.22), w: 22 + rs() * 6, lean: 0.25 + rs() * 0.35, bend: 0.12 + rs() * 0.12 });
  for (let i = 0; i < 2; i++) big.push({ up: false, fx: 0.3 + i * 0.38 + rs() * 0.1, len: th * (0.4 + rs() * 0.25), w: 22 + rs() * 6, lean: 0.3 + rs() * 0.4, bend: 0.12 + rs() * 0.12 });
  const hornSpec = [];
  for (const t of [0.14, 0.3, 0.46, 0.62, 0.8, 0.92]) hornSpec.push({ t: t + (rs() - 0.5) * 0.05, len: (t > 0.4 && t < 0.7 ? 70 + rs() * 60 : 22 + rs() * 50) * scale, w: 10 + rs() * 7 });
  for (const side of [-1, 1]) {
    for (const b of big) {
      const p = colInk(cx + side * b.fx * tw / 2, b.up);
      if (!p) continue;
      let dx = side * b.lean, dy = b.up ? -1 : 1;
      const l = Math.hypot(dx, dy); dx /= l; dy /= l;
      thorn(m, p[0], p[1] + (b.up ? 8 : -8), dx, dy, b.len, b.w * scale, side * b.bend * (b.up ? 1 : -1));
    }
    const top = Math.max(30, ty0 - th * 0.66), bot = Math.min(LH - 30, ty1 + th * 0.74);
    const at = crescent(m,
      [cx + side * (tw / 2 - tw * 0.07), top],
      [cx + side * (tw / 2 + LW * 0.075), cy],
      [cx + side * (tw / 2 - tw * 0.05), bot],
      28 * scale);
    for (const s of hornSpec) {
      const p = at(s.t);
      let ox = p.nx * -side, oy = p.ny * -side;
      const toward = s.t < 0.5 ? -1 : 1;
      ox += p.tx * toward * 0.55; oy += p.ty * toward * 0.55;
      const l = Math.hypot(ox, oy); ox /= l; oy /= l;
      thorn(m, p.x, p.y, ox, oy, s.len, s.w * scale, 0.12 * toward * side);
    }
  }

  // --- barbed wire: back half passes behind the letters, front half in front ---
  const E = { x: cx, y: cy + th * 0.05, rx: tw / 2 + LW * 0.03, ry: th * 0.6, rot: (rs() - 0.5) * 0.07 };
  wire(lc, E, false, r);
  lc.globalCompositeOperation = 'destination-out';
  for (const [ox, oy] of DIL) lc.drawImage(mc, ox, oy);
  lc.globalCompositeOperation = 'source-over';
  m.drawImage(layer, 0, 0);
  wire(lc, E, true, r);
  m.globalCompositeOperation = 'destination-out';
  for (const [ox, oy] of DIL) m.drawImage(layer, ox, oy);
  m.globalCompositeOperation = 'source-over';
  m.drawImage(layer, 0, 0);

  return m.getImageData(0, 0, LW, LH).data;
}

// ---------- height field: rounded "inflated chrome" profile from a distance transform ----------
function edt1d(f, n, d, v, z) {

  gl.uniform1i(u.uVelocity, vel.read.attach(0));
  gl.uniform1i(u.uDye, dye.read.attach(1));
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, logoTex); gl.uniform1i(u.uLogo, 2);
  gl.uniform4f(u.uRect, rect[0], rect[1], rect[2], rect[3]);
  gl.uniform2f(u.uSimTexel, 1 / vel.w, 1 / vel.h);
  gl.uniform1f(u.uDisp, SIM.disp);
  const c = hexRgb(state.color);
  gl.uniform3f(u.uTint, c[0] * 0.82, c[1] * 0.82, c[2] * 0.92);
  gl.uniform3f(u.uGlow, c[0] + (1 - c[0]) * 0.5, c[1] + (1 - c[1]) * 0.5, c[2] + (1 - c[2]) * 0.5);
  blit(null);
}

// ---------- input ----------
const ptr = { x: 0, y: 0, px: 0, py: 0, moved: false, has: false };
let lastInput = performance.now(), demoT = 0, demoPrev = null;
function onMove(e) {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
  if (!ptr.has) { ptr.px = x; ptr.py = y; ptr.has = true; }
  ptr.x = x; ptr.y = y; ptr.moved = true;
  lastInput = performance.now(); demoPrev = null;
}
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerdown', (e) => { const r = canvas.getBoundingClientRect(); ptr.px = (e.clientX - r.left) / r.width; ptr.py = 1 - (e.clientY - r.top) / r.height; ptr.has = true; onMove(e); }, { passive: true });
window.addEventListener('pointerleave', () => { ptr.has = false; });

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  resize();
  const rect = slotRect();
  if (ptr.moved) { stroke(ptr.x, ptr.y, ptr.px, ptr.py); ptr.px = ptr.x; ptr.py = ptr.y; ptr.moved = false; }
  else if (state.auto && !reduceMotion && haveHeight && now - lastInput > 3000) {
    demoT += dt;
    const t = demoT * 1.5;
    const x = rect[0] + rect[2] * (0.5 + 0.36 * Math.sin(t * 1.1) + 0.05 * Math.sin(t * 3.1));
    const y = rect[1] + rect[3] * (0.5 + 0.24 * Math.sin(t * 1.9 + 0.7));
    if (demoPrev) stroke(x, y, demoPrev[0], demoPrev[1]);
    demoPrev = [x, y];
  }
  step(dt);
  render(rect);
  requestAnimationFrame(frame);
}

try { resize(); } catch (e) { console.error(e); fallback(); wireUi(null); return; }
wireUi({ rebuild, shadeLogo });
const ready = rebuild();
if (!RENDER) requestAnimationFrame(frame);
else {
  // The recorder drives time: one call = one video frame, pointer given in CSS px (or null to keep still).
  const cursor = $('cursor');
  let prev = null;
  // Scale the logo box so the drawn mark (not its empty margin) fills the frame, whatever the word length.
  const fit = () => {
    const [bx0, by0, bx1, by1] = logoBox;
    const caps = !document.documentElement.classList.contains('logo-only');
    const availW = innerWidth * 0.9, availH = innerHeight * 0.9 - (caps ? 250 : 0);
    const w = Math.min(availW / (bx1 - bx0), availH / ((by1 - by0) * 9 / 16));
    const h = w * 9 / 16;
    slot.style.width = w + 'px';
    slot.style.marginBlock = `${-by0 * h + 8}px ${-(1 - by1) * h + 8}px`;
  };
  window.liquidLogo = {
    ready: Promise.resolve(ready).then(fit),
    rect() { const r = slot.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
    async frame(x, y, fps) {
      resize();
      const rect = slotRect();
      if (x != null) {
        const cr = canvas.getBoundingClientRect();
        const u = (x - cr.left) / cr.width, v = 1 - (y - cr.top) / cr.height;
        if (prev) stroke(u, v, prev[0], prev[1]);
        prev = [u, v];
        cursor.style.transform = `translate(${x}px, ${y}px)`;
      }
      step(1 / fps);
      render(rect);
      await new Promise((r) => requestAnimationFrame(() => r()));
    },
  };
}

// ---------- controls ----------
function wireUi(api) {
  const t = $('t'), c1 = $('c1'), c2 = $('c2'), f = $('f'), col = $('col'), auto = $('auto');
  t.value = state.text; c1.value = state.cap1; c2.value = state.cap2; f.value = state.font; col.value = state.color; auto.checked = state.auto;
  $('cap1out').textContent = state.cap1; $('cap2out').textContent = state.cap2;
  const edit = $('edit'), panel = $('panel');
  edit.addEventListener('click', () => { panel.hidden = !panel.hidden; edit.setAttribute('aria-expanded', String(!panel.hidden)); if (!panel.hidden) t.focus(); });
  panel.addEventListener('submit', (e) => e.preventDefault());
  let timer = 0;
  const later = () => { clearTimeout(timer); timer = setTimeout(() => { if (api) api.rebuild(); else $('fallback').textContent = state.text; }, 220); };
  t.addEventListener('input', () => { state.text = t.value; save(); later(); });
  c1.addEventListener('input', () => { state.cap1 = c1.value; $('cap1out').textContent = c1.value; save(); });
  c2.addEventListener('input', () => { state.cap2 = c2.value; $('cap2out').textContent = c2.value; save(); });
  f.addEventListener('change', () => { state.font = f.value; save(); if (api) api.rebuild(); });
  let pending = false;
  col.addEventListener('input', () => { state.color = col.value; save(); if (api && !pending) { pending = true; requestAnimationFrame(() => { pending = false; api.shadeLogo(); }); } });
  auto.addEventListener('change', () => { state.auto = auto.checked; save(); });
  $('reroll').addEventListener('click', () => { state.seed = (state.seed * 7 + 13) % 100003; save(); if (api) api.rebuild(); });
}
})();
</script>
